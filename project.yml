name: Shinian
options:
  bundleIdPrefix: com.ganhoo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  Shinian:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 拾念
        CFBundleShortVersionString: "1.2.2"
        CFBundleVersion: "5"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 用于在笔记中添加图片
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Config/Shinian.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ganhoo.shinian
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.shinian
        PRODUCT_NAME: Shinian
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.2.2"
        CURRENT_PROJECT_VERSION: "5"
        ENABLE_PREVIEWS: YES
