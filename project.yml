name: FlashMemo
options:
  bundleIdPrefix: com.ganhoo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  FlashMemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: 闪念
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: 用于在笔记中添加图片
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.flashmemo
        PRODUCT_NAME: FlashMemo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_PREVIEWS: YES
