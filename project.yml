name: Shinian
options:
  bundleIdPrefix: com.ganhoo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
targets:
  Shinian:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Jin Notes
        CFBundleShortVersionString: "1.8.1"
        CFBundleVersion: "18"
        CFBundleDevelopmentRegion: zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # 保持经典界面风格，不启用 iOS 26 液态玻璃
        UIDesignRequiresCompatibility: true
        NSPhotoLibraryUsageDescription: 用于在笔记中添加图片
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: Config/Shinian.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.ganhoo.shinian
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.shinian
        PRODUCT_NAME: Shinian
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.8.1"
        CURRENT_PROJECT_VERSION: "18"
        ENABLE_PREVIEWS: YES
  ShinianUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Shinian
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ganhoo.shinian.uitests
        TEST_TARGET_NAME: Shinian
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Shinian:
    build:
      targets:
        Shinian: all
    test:
      config: Debug
      targets:
        - ShinianUITests
